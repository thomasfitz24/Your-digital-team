<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemp Services — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1D27;
  --sky:#6FBFE5;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:clip;}
body{
  font-family:'Archivo',system-ui,sans-serif;
  background:var(--navy);
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%;}
a{text-decoration:none;color:inherit;}

/* Split hero: solid navy for the words, the photograph left untouched
   on the right so it stays bright instead of turning to mud. */
.hero{
  position:relative;
  min-height:100svh;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  background:var(--navy);
  overflow:hidden;
}

.hero img{
  position:absolute;
  right:0;
  top:0;
  width:50%;
  height:100%;
  object-fit:cover;
  object-position:46% center;
}

/* softens the hard seam between panel and photograph */
.hero::after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  width:150px;
  height:100%;
  z-index:1;
  background:linear-gradient(90deg,var(--navy),rgba(13,29,39,0));
  pointer-events:none;
}

.inner{
  position:relative;
  z-index:2;
  width:100%;
  padding:100px 60px 100px max(40px, calc((100vw - 1280px)/2 + 40px));
}

.copy{max-width:540px;}

h1{
  color:#fff;
  font-weight:600;
  font-size:clamp(2.6rem, 1.5rem + 3.6vw, 4.4rem);
  line-height:1.02;
  letter-spacing:-.035em;
  text-wrap:balance;
}

p{
  margin-top:26px;
  color:#D4E3EC;
  font-size:clamp(1rem, .95rem + .3vw, 1.15rem);
  line-height:1.62;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:16px 28px;
  margin-top:40px;
}

.btn{
  display:inline-flex;
  align-items:center;
  min-height:56px;
  padding:0 30px;
  background:var(--sky);
  color:var(--navy);
  font-size:15px;
  font-weight:600;
  transition:background .18s ease;
}
.btn:hover{background:#96D3F0;}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px;}

.tel{
  display:inline-flex;
  align-items:center;
  gap:11px;
  min-height:56px;
  color:#fff;
  font-size:1.2rem;
  font-weight:600;
  letter-spacing:-.01em;
}
.tel svg{width:19px;height:19px;color:var(--sky);}
.tel:hover{color:var(--sky);}
.tel:focus-visible{outline:3px solid var(--sky);outline-offset:3px;}

@media (max-width:860px){
  .hero{
    grid-template-columns:1fr;
    min-height:0;
  }
  .hero img{
    position:relative;
    width:100%;
    height:44svh;
    object-position:46% center;
  }
  .hero::after{display:none;}
  .inner{padding:48px 20px 72px;}
  .copy{max-width:none;}
  .btn{width:100%;justify-content:center;}
  .actions{gap:14px;}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;}
}
</style>
</head>
<body>

<section class="hero">
  <img
    src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=2000&q=78&auto=format&fit=crop"
    alt="Kemp Services operative cleaning a window">

  <div class="inner">
    <div class="copy">
      <h1>Leave the cleaning to us.</h1>
      <p>
        At Kemp Services, we want to build a long-term relationship with our
        commercial cleaning clients to ensure you know you can concentrate on
        running your business and leave the cleaning to us.
      </p>
      <div class="actions">
        <a class="btn" href="#">Get a quote today</a>
        <a class="tel" href="tel:+442000000000">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.7a2 2 0 0 1 1.7 2z"/></svg>
          020 0000 0000
        </a>
      </div>
    </div>
  </div>
</section>

</body>
</html>
