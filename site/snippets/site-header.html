<!-- ═══════════════════════════════════════════════════════════════
     SITE HEADER — the real one, on its own
     The glass pill, the inline links with the sliding underline, the
     grid button, the burger, and the full-width dropdown panel.

     ⚠ THIS IS A COPY FOR READING AND REUSE — NOT A REPLACEMENT.
     Your live header lives inside header-injection.html, which also
     builds the footer, loads GSAP for every page Code Block, and
     handles cookie consent. If you paste this over that file you
     lose all three and every page block that expects GSAP breaks.
     Use this to look at the header, or to drop it on a page that
     does not get the injection.

     Fonts: NB International Pro, with Inter behind it. IBM Plex Mono
     for the small nav links. Same as the live site.

     Edit the links in MENU and PILL_NAV and both the pill and the
     panel update — they are built from those two lists.
     The social links are still '#'; they were never filled in.
     ═══════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/nb-international-pro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Squarespace ships its own header; this one replaces it.
   Remove these two rules if you are not on Squarespace. */
#header, .header, .Header { display: none !important; }
#siteWrapper, #page { padding-top: 0 !important; }

/* Tokens the chrome needs. Declared with fallbacks so the file also works
   on a page that has not defined the site palette. */
.ydt-header, .ydt-backdrop {
  --white: #f2f2f0;
  --gray5: #8a8f98;
  --gray6: #565b64;
  --panel: #0a0a0b;
  --line: rgba(255, 255, 255, 0.07);
  --data: #ff4536;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --menu-dur: 1.15s;
  --menu-ease: cubic-bezier(0.62, 0.02, 0.2, 1);
}
.ydt-header, .ydt-header * {
  font-family: 'NB International Pro', 'Inter', 'Arial', sans-serif;
  box-sizing: border-box;
}

/* ══════════ HEADER (glass pill) ══════════ */
.ydt-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 39;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 0.35s var(--ease);
}
.ydt-backdrop--visible { display: block; opacity: 1; }

.ydt-header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
/* width-capped, not %-padded: the pill keeps a sane measure on every screen */
.ydt-header__shell { padding: 14px 16px; max-width: 920px; margin: 0 auto; }
@media (min-width: 768px) { .ydt-header__shell { padding: 22px 24px; } }

.ydt-header__pill {
  border-radius: 16px;
  padding: 16px 22px;
  position: relative;
  /* warm frosted tint that picks up whatever is behind it; no border, no drop shadow */
  background: rgba(40, 38, 34, 0.42);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  transition: background var(--menu-dur) var(--menu-ease);
}
@media (min-width: 768px) { .ydt-header__pill { padding: 20px 30px; } }
/* the panel darkens as it opens so the large links stay legible */
.ydt-header--dropdown-open .ydt-header__pill {
  background: rgba(24, 22, 20, 0.82);
}

.ydt-header__row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; }
@media (min-width: 768px) { .ydt-header__row { grid-template-columns: auto 1fr auto; } }

.ydt-header__logo {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--white);
  text-decoration: none;
  position: relative;
  z-index: 60;
  white-space: nowrap;
}
@media (min-width: 768px) { .ydt-header__logo { font-size: 15px; } }

.ydt-header__nav {
  display: none;
  align-items: center;
  gap: 22px;
  position: relative;
  height: 20px;
  justify-self: center;
  transition: opacity 0.35s var(--ease);
}
@media (min-width: 768px) { .ydt-header__nav { display: flex; } }
/* inline links step aside for the open panel */
.ydt-header--dropdown-open .ydt-header__nav { opacity: 0; pointer-events: none; }

.ydt-header .ydt-header__nav-link {
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-weight: 500;
  font-family: inherit;
  color: var(--white);
  text-decoration: none;
  transition: color 0.3s;
  position: relative;
  white-space: nowrap;
}
.ydt-header__nav-link:hover { color: rgba(255, 255, 255, 0.75); }

.ydt-header__underline {
  position: absolute;
  bottom: -8px;
  height: 2px;
  background: var(--white);
  opacity: 0;
  transition: left 0.4s var(--ease), width 0.4s var(--ease), opacity 0.25s;
  pointer-events: none;
}

.ydt-header__controls { display: flex; align-items: center; z-index: 60; position: relative; }

.ydt-header__grid-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border: none;
  background: transparent;
  cursor: pointer;
  color: rgba(255, 255, 255, 0.9);
  transition: color 0.25s;
  padding: 0;
}
@media (min-width: 768px) { .ydt-header__grid-btn { display: flex; } }
.ydt-header__grid-btn:hover { color: var(--white); }
/* the grid turns to a diamond rather than an X */
.ydt-header__grid-btn svg {
  transition: transform var(--menu-dur) var(--menu-ease);
  transform-origin: center;
}
/* a turn and a half of the icon's own symmetry (90 + 45), landing on the diamond */
.ydt-header--dropdown-open .ydt-header__grid-btn svg { transform: rotate(135deg); }
.ydt-header--dropdown-open .ydt-header__grid-btn { color: var(--white); }

.ydt-header__burger {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border: none;
  background: transparent;
  cursor: pointer;
  color: var(--white);
  padding: 4px;
}
@media (min-width: 768px) { .ydt-header__burger { display: none; } }

.ydt-header__icon-wrap { position: relative; width: 16px; height: 16px; }
.ydt-header__icon {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
}
.ydt-header__icon--open { opacity: 1; transform: scale(1) rotate(0deg); }
.ydt-header__icon--close { opacity: 0; transform: scale(0) rotate(-180deg); }
.ydt-header--dropdown-open .ydt-header__icon--open { opacity: 0; transform: scale(0) rotate(180deg); }
.ydt-header--dropdown-open .ydt-header__icon--close { opacity: 1; transform: scale(1) rotate(0deg); }

/* ── dropdown panel ── */
.ydt-header__dropdown {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height var(--menu-dur) var(--menu-ease), opacity var(--menu-dur) var(--menu-ease);
}
.ydt-header--dropdown-open .ydt-header__dropdown { max-height: 560px; opacity: 1; }

.ydt-header__dropdown-inner { padding: 34px 0 4px; }
@media (min-width: 768px) { .ydt-header__dropdown-inner { padding: 44px 0 6px; } }

.ydt-header__dropdown-links { display: flex; flex-direction: column; }

.ydt-header__dropdown-item {
  opacity: 0;
  transform: translateX(-24px);
  filter: blur(6px);
  transition: opacity 0.65s var(--ease), transform 0.65s var(--ease), filter 0.65s var(--ease);
}
.ydt-header--dropdown-open .ydt-header__dropdown-item { opacity: 1; transform: translateX(0); filter: blur(0px); }
.ydt-header--dropdown-open .ydt-header__dropdown-item:nth-child(1) { transition-delay: 0.12s; }
.ydt-header--dropdown-open .ydt-header__dropdown-item:nth-child(2) { transition-delay: 0.19s; }
.ydt-header--dropdown-open .ydt-header__dropdown-item:nth-child(3) { transition-delay: 0.26s; }
.ydt-header--dropdown-open .ydt-header__dropdown-item:nth-child(4) { transition-delay: 0.33s; }
.ydt-header--dropdown-open .ydt-header__dropdown-item:nth-child(5) { transition-delay: 0.40s; }
.ydt-header--dropdown-open .ydt-header__dropdown-item:nth-child(6) { transition-delay: 0.47s; }

.ydt-header__dropdown-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 5px 0;
  font-family: inherit;
  text-decoration: none;
}
.ydt-header__dropdown-label {
  display: block;
  font-size: clamp(1.5rem, 3.6vw, 2rem);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  line-height: 1.32;
  color: var(--white);
  transition: color 0.3s var(--ease), transform 0.4s var(--ease);
}
.ydt-header__dropdown-btn:hover .ydt-header__dropdown-label {
  color: rgba(255, 255, 255, 0.45);
  transform: translateX(8px);
}

/* ── social row ── */
.ydt-header__dropdown-social {
  margin-top: 26px;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  gap: 20px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s 0.5s var(--ease), transform 0.5s 0.5s var(--ease);
}
.ydt-header--dropdown-open .ydt-header__dropdown-social { opacity: 1; transform: translateY(0); }
.ydt-header__social-link {
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.55);
  text-decoration: none;
  transition: color 0.25s, transform 0.25s var(--ease);
}
.ydt-header__social-link svg { width: 16px; height: 16px; display: block; }
.ydt-header__social-link:hover { color: var(--white); transform: translateY(-2px); }
</style>

<script>
/* ══════════════════════════════════════════════════════════════════
   SITE HEADER — built from the link maps below.
   Add a page to MENU or PILL_NAV and it appears in the menu.
   ══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ── the links, in one place ── */
  var MENU = [
    { href: '/',            label: 'Home' },
    { href: '/services',         label: 'All Services' },
    { href: '/about',            label: 'About' },
    { href: 'https://dev.yourdigiteam.com/',    label: 'Client Login' },
    { href: '/web-development', label: 'Website Builder' },
    { href: '/contact',          label: 'Contact' }
  ];
  var PILL_NAV = [
    { href: '/#services', label: 'Services' },
    { href: 'https://dev.yourdigiteam.com/',  label: 'Login' },
    { href: '/contact',        label: 'Contact' }
  ];

  var SOCIALS = [
    { label: 'Facebook',  href: '#', path: 'M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.8 3.7-3.8 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z' },
    { label: 'Instagram', href: '#', path: 'M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.8s0 3.6-.1 4.9c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2-.1-1.3-.1-1.7-.1-4.9s0-3.5.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4 1.3-.1 1.7-.1 4.9-.1zm0 3.2A6.6 6.6 0 1 0 18.6 12 6.6 6.6 0 0 0 12 5.4zm0 10.9A4.3 4.3 0 1 1 16.3 12 4.3 4.3 0 0 1 12 16.3zm8.4-11.2a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5z' },
    { label: 'X',         href: '#', path: 'M18.2 2.3h3.3l-7.2 8.2L22.8 22h-6.6l-5.2-6.8L5.1 22H1.8l7.7-8.8L1.5 2.3h6.8l4.7 6.2 5.2-6.2zm-1.2 17.7h1.8L7.1 4.2H5.2L17 20z' },
    { label: 'YouTube',   href: '#', path: 'M23 7.6a2.9 2.9 0 0 0-2-2.1C19.1 5 12 5 12 5s-7.1 0-8.9.5a2.9 2.9 0 0 0-2.1 2.1A30 30 0 0 0 .5 12a30 30 0 0 0 .5 4.4 2.9 2.9 0 0 0 2.1 2.1c1.8.5 8.9.5 8.9.5s7.1 0 8.9-.5a2.9 2.9 0 0 0 2.1-2.1 30 30 0 0 0 .5-4.4 30 30 0 0 0-.5-4.4zM9.8 15.3V8.7l5.7 3.3z' },
    { label: 'TikTok',    href: '#', path: 'M16.6 5.8a4.8 4.8 0 0 1-1.2-3.2h-3.3v13.1a2.7 2.7 0 1 1-1.9-2.6V9.7a5.9 5.9 0 1 0 5.2 5.9V9.2A8 8 0 0 0 20 10.7V7.5a4.8 4.8 0 0 1-3.4-1.7z' },
    { label: 'LinkedIn',  href: '#', path: 'M20.4 20.4h-3.5v-5.6c0-1.3 0-3-1.9-3s-2.1 1.4-2.1 2.9v5.7H9.4V9h3.3v1.6h.1a3.7 3.7 0 0 1 3.3-1.8c3.6 0 4.3 2.3 4.3 5.4v6.2zM5.3 7.4a2.1 2.1 0 1 1 2.1-2.1 2.1 2.1 0 0 1-2.1 2.1zm1.8 13H3.6V9h3.5v11.4zM22.2 0H1.8A1.8 1.8 0 0 0 0 1.8v20.4A1.8 1.8 0 0 0 1.8 24h20.4a1.8 1.8 0 0 0 1.8-1.8V1.8A1.8 1.8 0 0 0 22.2 0z' }
  ];

  /* ── which page are we on ── */
  var HERE = (location.pathname.split('/').pop() || '/').toLowerCase();
  if (HERE === '') HERE = '/';

  /* A link written as "index.html#services" becomes a bare "#services" when
     we are already on the home page, so in-page scrolling and the underline
     spy keep working instead of reloading the document. */
  function resolve(href) {
    var hash = href.indexOf('#');
    if (hash < 0) return href;
    var file = href.slice(0, hash).toLowerCase();
    return (file === HERE || (file === '/' && HERE === '/'))
      ? href.slice(hash)
      : href;
  }
  function isCurrent(href) {
    var file = href.split('#')[0].toLowerCase().replace(/\/+$/, '') || '/';
    return file === HERE && href.indexOf('#') < 0;
  }
  function esc(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function linkAttrs(item) {
    return 'href="' + esc(resolve(item.href)) + '"' + (isCurrent(item.href) ? ' aria-current="page"' : '');
  }

  /* ══════════ MARKUP ══════════ */
  function headerHTML() {
    return '' +
    '<div class="ydt-header__shell">' +
      '<div class="ydt-header__pill" id="ydtPill">' +
        '<div class="ydt-header__row">' +
          '<a href="' + esc(resolve('/#top')) + '" class="ydt-header__logo" aria-label="yourdigitalteam home">yourdigitalteam.</a>' +

          '<nav class="ydt-header__nav" aria-label="Primary navigation">' +
            '<div class="ydt-header__underline" id="ydtUnderline" aria-hidden="true"></div>' +
            PILL_NAV.map(function (n) {
              return '<a ' + linkAttrs(n) + ' class="ydt-header__nav-link">' + esc(n.label) + '</a>';
            }).join('') +
          '</nav>' +

          '<div class="ydt-header__controls">' +
            '<button class="ydt-header__grid-btn" id="ydtGridBtn" aria-expanded="false" aria-controls="ydtDropdown" aria-label="Open menu">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
                '<rect x="2" y="2" width="8.5" height="8.5" rx="1.4"/>' +
                '<rect x="13.5" y="2" width="8.5" height="8.5" rx="1.4"/>' +
                '<rect x="2" y="13.5" width="8.5" height="8.5" rx="1.4"/>' +
                '<rect x="13.5" y="13.5" width="8.5" height="8.5" rx="1.4"/>' +
              '</svg>' +
            '</button>' +
            '<button class="ydt-header__burger" id="ydtBurger" aria-expanded="false" aria-controls="ydtDropdown" aria-label="Toggle menu">' +
              '<div class="ydt-header__icon-wrap">' +
                '<span class="ydt-header__icon ydt-header__icon--open" aria-hidden="true">' +
                  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>' +
                '</span>' +
                '<span class="ydt-header__icon ydt-header__icon--close" aria-hidden="true">' +
                  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
                '</span>' +
              '</div>' +
            '</button>' +
          '</div>' +
        '</div>' +

        '<div class="ydt-header__dropdown" id="ydtDropdown" role="menu" aria-label="Site pages">' +
          '<div class="ydt-header__dropdown-inner">' +
            '<div class="ydt-header__dropdown-links">' +
              MENU.map(function (m) {
                return '<div class="ydt-header__dropdown-item" role="none">' +
                  '<a ' + linkAttrs(m) + ' class="ydt-header__dropdown-btn" role="menuitem">' +
                    '<span class="ydt-header__dropdown-label">' + esc(m.label) + '</span>' +
                  '</a></div>';
              }).join('') +
            '</div>' +
            '<div class="ydt-header__dropdown-social" aria-label="Social links">' +
              SOCIALS.map(function (s) {
                return '<a href="' + esc(s.href) + '" class="ydt-header__social-link" aria-label="' + esc(s.label) + '">' +
                  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="' + s.path + '"/></svg></a>';
              }).join('') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ══════════ MOUNT ══════════ */
  function mount() {
    if (document.getElementById('ydtHeader')) return;   /* page ships its own */

    var backdrop = document.createElement('div');
    backdrop.className = 'ydt-backdrop';
    backdrop.id = 'ydtBackdrop';
    backdrop.setAttribute('aria-hidden', 'true');

    var header = document.createElement('header');
    header.className = 'ydt-header';
    header.id = 'ydtHeader';
    header.setAttribute('role', 'banner');
    header.innerHTML = headerHTML();

    document.body.insertBefore(header, document.body.firstChild);
    document.body.insertBefore(backdrop, header);

    wire(header, backdrop);
  }

  /* ══════════ BEHAVIOUR ══════════ */
  function wire(header, backdrop) {
    var pill = header.querySelector('#ydtPill');
    var gridBtn = header.querySelector('#ydtGridBtn');
    var burger = header.querySelector('#ydtBurger');
    var dropdown = header.querySelector('#ydtDropdown');
    var underline = header.querySelector('#ydtUnderline');
    var navEl = header.querySelector('.ydt-header__nav');
    var navLinks = header.querySelectorAll('.ydt-header__nav-link');
    var isOpen = false;

    function openDropdown() {
      isOpen = true;
      header.classList.add('ydt-header--dropdown-open');
      gridBtn.setAttribute('aria-expanded', 'true');
      gridBtn.setAttribute('aria-label', 'Close menu');
      burger.setAttribute('aria-expanded', 'true');
      dropdown.style.maxHeight = dropdown.scrollHeight + 'px';
      backdrop.classList.add('ydt-backdrop--visible');
      document.body.style.overflow = 'hidden';
    }
    function closeDropdown() {
      isOpen = false;
      header.classList.remove('ydt-header--dropdown-open');
      gridBtn.setAttribute('aria-expanded', 'false');
      gridBtn.setAttribute('aria-label', 'Open menu');
      burger.setAttribute('aria-expanded', 'false');
      dropdown.style.maxHeight = '0px';
      backdrop.classList.remove('ydt-backdrop--visible');
      document.body.style.removeProperty('overflow');
    }
    function toggleDropdown() { isOpen ? closeDropdown() : openDropdown(); }

    gridBtn.addEventListener('click', toggleDropdown);
    burger.addEventListener('click', toggleDropdown);
    backdrop.addEventListener('click', closeDropdown);
    document.addEventListener('mousedown', function (e) {
      if (isOpen && !pill.contains(e.target)) closeDropdown();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isOpen) closeDropdown();
    });
    dropdown.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', closeDropdown);
    });

    /* the underline rests on the section you're in and follows the cursor on hover */
    var activeNavLink = null;
    var navHovered = false;

    function placeUnderline(link) {
      if (!link || !navEl) { underline.style.opacity = '0'; return; }
      var rect = link.getBoundingClientRect();
      var navRect = navEl.getBoundingClientRect();
      underline.style.left = (rect.left - navRect.left) + 'px';
      underline.style.width = rect.width + 'px';
      underline.style.opacity = '1';
    }
    function setActiveNav(hash) {
      activeNavLink = null;
      navLinks.forEach(function (l) {
        if (l.getAttribute('href') === hash) activeNavLink = l;
      });
      if (!navHovered) placeUnderline(activeNavLink);
    }

    navLinks.forEach(function (link) {
      link.addEventListener('mouseenter', function () { navHovered = true; placeUnderline(link); });
    });
    if (navEl) {
      navEl.addEventListener('mouseleave', function () { navHovered = false; placeUnderline(activeNavLink); });
    }
    window.addEventListener('resize', function () {
      placeUnderline(navHovered ? null : activeNavLink);
      if (isOpen) dropdown.style.maxHeight = dropdown.scrollHeight + 'px';
    });

    /* ── track the section in view so the underline follows ── */
    function trackSections() {
      var targets = [];
      navLinks.forEach(function (l) {
        var href = l.getAttribute('href');
        if (!href || href.charAt(0) !== '#') return;
        var el = document.querySelector(href);
        if (el) targets.push({ el: el, hash: href });
      });
      if (!targets.length || !('IntersectionObserver' in window)) return;
      var obs = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          for (var i = 0; i < targets.length; i++) {
            if (targets[i].el === entry.target) { setActiveNav(targets[i].hash); return; }
          }
        });
      }, { rootMargin: '-45% 0px -45% 0px' });
      targets.forEach(function (t) { obs.observe(t.el); });
    }
    trackSections();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();
</script>
